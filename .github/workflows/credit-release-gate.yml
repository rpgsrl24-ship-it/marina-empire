name: Credit release gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marina-empire-credit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  credit-release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify real-money credits remain gated
        run: node tests/credit-release-gate.test.cjs
