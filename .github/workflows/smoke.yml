name: Marina Empire smoke tests
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'beta-test/**'
      - '*.html'
      - 'assets/**'
      - 'advertising/**'
      - 'anteprima/**'
      - 'manifest.webmanifest'
      - 'app-icon.svg'
      - 'package.json'
      - 'package-lock.json'
      - 'route-planner.js'
      - 'local-save-context.js'
      - 'save-state-guard.js'
      - 'live-traffic.js'
      - 'service-chains.js'
      - 'marina-npc.js'
      - 'marine-catalogo-approvato.json'
      - 'marine-deluxe-originali.html'
      - 'isola-delle-rose-originale.html'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: marina-empire-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify game scripts and core elements
        run: node tests/smoke.cjs
      - name: Verify local pages and media resolve
        run: node tests/local-assets.test.cjs
      - name: Verify marina inventory against 3D scene
        run: node scripts/check-marina-inventory.cjs
      - name: Verify actual scene capacities and safe berth resolution
        run: node scripts/test-visual-berth-resolver.cjs
      - name: Verify modern account and credit contracts
        run: |
          node tests/account-ui.test.cjs
          node tests/credit-release-gate.test.cjs
          node tests/marina-services.test.cjs
          node tests/mission-selection.test.cjs
          node tests/fleet-switching.test.cjs
          node tests/research-upgrade.test.cjs
          node tests/marketplace-credits.test.cjs
          node tests/direction-balance.test.cjs
          node tests/account-pwa-modern.test.cjs
