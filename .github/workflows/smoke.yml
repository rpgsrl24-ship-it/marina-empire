name: Marina Empire smoke tests
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'route-planner.js'
      - 'marine-catalogo-approvato.json'
      - 'marine-deluxe-originali.html'
      - 'scripts/check-marina-inventory.cjs'
      - 'tests/**'
      - '.github/workflows/smoke.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: marina-empire-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify game scripts and core elements
        run: node tests/smoke.cjs
      - name: Verify marina inventory against 3D scene
        run: node scripts/check-marina-inventory.cjs
