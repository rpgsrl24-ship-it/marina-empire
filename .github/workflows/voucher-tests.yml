name: Voucher integration tests
on:
  push:
    paths:
      - 'integrations/voucher-crypto.ts'
      - 'integrations/woo-order-validator.ts'
      - 'integrations/voucher-integration.test.ts'
      - 'integrations/voucher-recovery-policy.ts'
      - 'integrations/voucher-recovery.test.ts'
      - '.github/workflows/voucher-tests.yml'
  pull_request:
    paths:
      - 'integrations/**'
      - '.github/workflows/voucher-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voucher-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run voucher regression tests
        run: deno test --no-check integrations/voucher-integration.test.ts integrations/voucher-recovery.test.ts
