name: Marina Empire mission regression
on:
  pull_request:
    paths:
      - 'index.html'
      - 'beta-test/**'
      - '.github/workflows/pages.yml'
      - 'admin.html'
      - 'route-planner.js'
      - 'local-save-context.js'
      - 'save-state-guard.js'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/**'
      - 'backend/**'
      - '.github/workflows/**'
  push:
    branches:
      - main
      - 'dev/mission-regression-2026-10-29'
    paths:
      - 'index.html'
      - 'beta-test/**'
      - '.github/workflows/pages.yml'
      - 'admin.html'
      - 'route-planner.js'
      - 'local-save-context.js'
      - 'save-state-guard.js'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/**'
      - 'backend/**'
      - '.github/workflows/**'
permissions:
  contents: read
concurrency:
  group: marina-empire-mission-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mission-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify modern mission and save contracts
        run: |
          node tests/smoke.cjs
          node tests/account-ui.test.cjs
          node tests/credit-release-gate.test.cjs
          node tests/marina-services.test.cjs
          node tests/mission-selection.test.cjs
          node tests/fleet-switching.test.cjs
          node tests/research-upgrade.test.cjs
          node tests/marketplace-credits.test.cjs

