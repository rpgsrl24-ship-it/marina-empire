name: Marina Empire mission regression
on:
  pull_request:
    paths:
      - 'index.html'
      - 'beta-test/**'
      - '.github/workflows/pages.yml'
      - 'admin.html'
      - 'route-planner.js'
      - 'local-save-context.js'
      - 'save-state-guard.js'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/**'
      - 'backend/**'
      - '.github/workflows/**'
  push:
    branches:
      - main
      - 'dev/mission-regression-2026-10-29'
    paths:
      - 'index.html'
      - 'beta-test/**'
      - '.github/workflows/pages.yml'
      - 'admin.html'
      - 'route-planner.js'
      - 'local-save-context.js'
      - 'save-state-guard.js'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/**'
      - 'backend/**'
      - '.github/workflows/**'
permissions:
  contents: read
concurrency:
  group: marina-empire-mission-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mission-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify every offline regression
        run: |
          for test in tests/*.test.cjs; do
            if [ "$test" != "tests/prelaunch-browser.test.cjs" ]; then
              node "$test"
            fi
          done

  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile gameplay QA
        run: npm run test:browser
      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marina-empire-browser-qa-${{ github.run_number }}
          path: test-results/prelaunch
          if-no-files-found: ignore
          retention-days: 14
