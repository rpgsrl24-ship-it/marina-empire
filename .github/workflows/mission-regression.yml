name: Marina Empire mission regression
on:
  pull_request:
    paths:
      - 'index.html'
      - 'admin.html'
      - 'route-planner.js'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/**'
      - 'backend/**'
      - '.github/workflows/**'
  push:
    branches:
      - main
      - 'dev/mission-regression-2026-10-29'
    paths:
      - 'index.html'
      - 'admin.html'
      - 'route-planner.js'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/**'
      - 'backend/**'
      - '.github/workflows/**'
permissions:
  contents: read
concurrency:
  group: marina-empire-mission-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mission-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify every offline regression
        run: |
          for test in tests/*.test.cjs; do
            if [ "$test" != "tests/prelaunch-browser.test.cjs" ]; then
              node "$test"
            fi
          done
