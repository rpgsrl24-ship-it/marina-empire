name: Deploy Marina Empire
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout beta test
        uses: actions/checkout@v4
        with:
          ref: beta/private-test-2026-10-29
          path: beta-test
      - name: Verify game before publishing
        run: node tests/smoke.cjs
      - name: Verify missions and cloud save contracts
        run: |
          node tests/mission-contract.test.cjs
          node tests/mission-arrival.test.cjs
          node tests/cloud-backup.test.cjs
          node tests/cloud-load.test.cjs
          node tests/account-ui.test.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published homepage
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --location --silent --show-error --max-time 20 "$PAGE_URL" | grep -q 'Marina Empire'; then
              echo "Published Marina Empire homepage is reachable"
              exit 0
            fi
            echo "Homepage not ready (attempt $attempt/5)"
            sleep 12
          done
          echo "Published homepage verification failed" >&2
          exit 1
