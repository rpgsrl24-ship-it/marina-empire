<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marina Empire | Rimini Rebuild</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#04283c;color:#eef7fc;font:14px system-ui}header{height:60px;display:flex;align-items:center;gap:26px;padding:0 24px;background:#061f36eF;border-bottom:1px solid #27617c}header strong{font-size:21px;letter-spacing:1px}header nav{display:flex;gap:24px;color:#b9d8e9}header span{margin-left:auto;color:#f6d590}main{height:calc(100dvh - 60px);position:relative;overflow:hidden}canvas{display:block}.panel{position:absolute;left:16px;top:16px;width:252px;padding:16px;border:1px solid #4c8198;border-radius:12px;background:#05283cdd;backdrop-filter:blur(10px)}.panel h2{font-size:19px;margin:0 0 12px}.stat{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #ffffff25}.stat b{color:#f9d58e}button{background:#164a64;border:1px solid #4d8ca9;border-radius:8px;padding:11px;color:#fff;cursor:pointer;width:100%;margin-top:9px;text-align:left}button:disabled{opacity:.5}.hint{position:absolute;bottom:14px;right:14px;background:#05283cdd;padding:12px;border-radius:8px}.notice{font-size:12px;color:#b8d8e8;line-height:1.5}@media(max-width:650px){header nav{display:none}.panel{width:195px;padding:10px}.hint{font-size:11px}}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script>
</head><body><header><strong>MARINA EMPIRE</strong><nav><span>Mappa</span><span>Le mie Marine</span><span>Mercato</span><span>Missioni</span><span>Yacht</span></nav><span id="wallet">🪙 25.000</span></header>
<main id="stage"><aside class="panel"><h2>🇮🇹 Marina di Rimini</h2><div class="stat">Pontili attivi <b id="active">1 / 7</b></div><div class="stat">Posti disponibili <b id="free">12</b></div><div class="stat">Barche in movimento <b>2</b></div><button id="unlock">Sblocca pontile · 4.000 crediti</button><button id="reset">Ripristina demo</button><p class="notice" id="status">Nuova ricostruzione indipendente. Tocca un posto per prenotarlo.</p></aside><div class="hint">Trascina per ruotare · Scorri per zoom</div></main>
<script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const stage=document.getElementById('stage'),scene=new THREE.Scene();scene.background=new THREE.Color(0x0a688e);scene.fog=new THREE.FogExp2(0x0a688e,.0015);
const camera=new THREE.PerspectiveCamera(42,1,.1,900);camera.position.set(155,175,200);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.55;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;stage.prepend(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,0,0);controls.minDistance=85;controls.maxDistance=390;controls.maxPolarAngle=1.36;controls.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xccefff,0x174657,2.1));const sun=new THREE.DirectionalLight(0xffedcf,3);sun.position.set(-90,150,65);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-180;sun.shadow.camera.right=180;sun.shadow.camera.top=180;sun.shadow.camera.bottom=-180;scene.add(sun);
const mat=(c,r=.68)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:r<.35?.3:.05});const concrete=mat(0xbcc4c1),stone=mat(0x8e9899),edge=mat(0xed5348),deck=mat(0x5cba9e),starter=mat(0xeac058),locked=mat(0x476d72),white=mat(0xf3f6f3,.27),windows=mat(0x16435b,.22),dark=mat(0x273d49),commercial=mat(0xe7d9bd),roof=mat(0x7b8b91),highlight=new THREE.MeshBasicMaterial({color:0x69e5c4,transparent:true,opacity:.22,depthWrite:false});
const sea=new THREE.Mesh(new THREE.PlaneGeometry(800,800,120,120),new THREE.MeshPhysicalMaterial({color:0x087a9b,metalness:.28,roughness:.25,clearcoat:1,clearcoatRoughness:.12}));sea.rotation.x=-Math.PI/2;sea.position.y=-.4;sea.receiveShadow=true;scene.add(sea);
function box(w,h,d,x,y,z,m,parent=scene){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function segment(a,b,width,m,height=1){const dx=b[0]-a[0],dz=b[1]-a[1],len=Math.hypot(dx,dz);const o=box(width,height,len,(a[0]+b[0])/2,height/2,(a[1]+b[1])/2,m);o.rotation.y=Math.atan2(dx,dz);return o}
function path(pts,width,m,height=1){for(let i=1;i<pts.length;i++)segment(pts[i-1],pts[i],width,m,height)}
// Harbor outline follows the reference composition; the entrance stays open at the north.
const left=[[-100,55],[-88,8],[-75,-45],[-48,-80],[25,-79],[94,-62]];
const northLeft=[[-100,55],[-47,78],[-7,91],[24,91]];
const northRight=[[56,91],[85,99],[125,73],[145,34],[141,-26],[123,-51],[94,-62]];
path(left,7,concrete,2.1);path(northLeft,7,concrete,2.1);path(northRight,7,concrete,2.1);
path(left,1.2,edge,2.35);path(northLeft,1.2,edge,2.35);path(northRight,1.2,edge,2.35);
// Seven finger piers, starting from the southern quay.
const specs=[{x:24,z:-76,angle:-.33,len:109},{x:-70,z:-57,angle:-.22,len:97},{x:-45,z:-73,angle:-.24,len:105},{x:-16,z:-77,angle:-.26,len:109},{x:72,z:-58,angle:.35,len:84},{x:119,z:-35,angle:.28,len:64},{x:86,z:79,angle:Math.PI+.4,len:46}];
const piers=[],slots=[],occupied=new Set();const store='marina-empire-rimini-rebuild-v1';let state;try{state=JSON.parse(localStorage.getItem(store))}catch{}state=state||{credits:25000,active:1,booked:[]};state.active=Math.max(1,Math.min(7,state.active));state.booked=Array.isArray(state.booked)?state.booked:[];state.booked.forEach(x=>occupied.add(x));
function yacht(parent,x,z,scale=.85){const g=new THREE.Group();g.position.set(x,.2,z);parent.add(g);
const sh=new THREE.Shape();sh.moveTo(-1.55,-4.8);sh.lineTo(1.55,-4.8);sh.bezierCurveTo(1.95,-1.5,1.55,2.9,0,5.4);sh.bezierCurveTo(-1.55,2.9,-1.95,-1.5,-1.55,-4.8);
const hull=new THREE.Mesh(new THREE.ExtrudeGeometry(sh,{depth:.8,bevelEnabled:true,bevelThickness:.2,bevelSize:.13,bevelSegments:2,curveSegments:14}),white);hull.rotation.x=-Math.PI/2;hull.position.y=.55;hull.castShadow=true;g.add(hull);
box(2.35,.9,4.5,0,1.25,-.8,white,g);box(2.1,.42,3.5,0,1.88,-.9,windows,g);box(2.35,.16,3.9,0,2.14,-.9,white,g);
for(const side of [-1,1]){box(.06,.12,7.8,side*1.35,1.05,-.1,stone,g);for(let i=0;i<6;i++)box(.05,.5,.05,side*1.35,1.24,-3.4+i*1.3,stone,g)}
box(.06,2.5,.06,0,3.1,-1.8,stone,g);g.scale.setScalar(scale);return g}
for(let i=0;i<specs.length;i++){const p=specs[i],group=new THREE.Group();group.position.set(p.x,0,p.z);group.rotation.y=p.angle;scene.add(group);
const spine=box(3,1,p.len,0,.5,p.len/2,i===0?starter:locked,group);
const places=[];for(let j=0;j<7;j++){const z=9+j*(p.len-19)/6;for(const side of [-1,1]){const id=(i+1)+'-'+(j*2+(side===1?2:1));const hit=box(6,.06,9,side*8,-.16,z,highlight,group);hit.userData={pier:i,id};places.push(hit);slots.push(hit);if(j<6&&((j+i)%3!==0))yacht(group,side*8,z,.55+(j%3)*.08)}}
piers.push({spine,places})}
for(let i=0;i<7;i++){const x=-45+i*21,z=-87+i*3.3;box(16,5.5,10,x,2.9,z,commercial);box(17,.65,11,x,6,z,roof);for(let k=-1;k<=1;k++)box(2.5,2.6,.14,x+k*4,2.6,z-5.1,windows)}
// Transit stays in the open approach channel; boats stop before returning to sea.
const route=[[37,115],[39,109],[41,102],[42,96],[43,91]];const traffic=[];
for(let i=0;i<2;i++){const g=yacht(scene,0,0,.75);traffic.push({g,phase:i*.5})}
function animate(t){for(const b of traffic){const phase=(t*.005+b.phase)%1,stop=phase>.35&&phase<.7;const v=phase<.35?phase/.35:stop?1:1-(phase-.7)/.3;const k=Math.min(route.length-2,Math.floor(v*(route.length-1))),f=v*(route.length-1)-k,a=route[k],c=route[k+1];b.g.position.set(a[0]+(c[0]-a[0])*f,stop?.2:Math.sin(t*1.5)*.035,a[1]+(c[1]-a[1])*f);b.g.rotation.y=Math.atan2(c[0]-a[0],c[1]-a[1])+(phase>=.7?Math.PI:0)}}
const save=()=>localStorage.setItem(store,JSON.stringify({...state,booked:[...occupied]}));const status=t=>document.getElementById('status').textContent=t;const money=n=>n.toLocaleString('it-IT');
function refresh(){document.getElementById('wallet').textContent='🪙 '+money(state.credits);document.getElementById('active').textContent=state.active+' / 7';document.getElementById('free').textContent=String(state.active*14-[...occupied].filter(x=>Number(x.split('-')[0])<=state.active).length);document.getElementById('unlock').disabled=state.active===7;piers.forEach((p,i)=>{p.spine.material=i===0?starter:i<state.active?deck:locked;p.places.forEach(h=>h.visible=i<state.active)})}refresh();
document.getElementById('unlock').onclick=()=>{if(state.active===7)return;if(state.credits<4000)return status('Crediti insufficienti.');state.credits-=4000;state.active++;save();refresh();status('Pontile '+state.active+' sbloccato.')};
document.getElementById('reset').onclick=()=>{localStorage.removeItem(store);location.reload()};
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();renderer.domElement.addEventListener('click',e=>{const r=renderer.domElement.getBoundingClientRect();mouse.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(mouse,camera);const hit=ray.intersectObjects(slots).find(x=>x.object.visible);if(!hit)return;const id=hit.object.userData.id;if(occupied.has(id)){occupied.delete(id);status('Ormeggio '+id+' liberato.')}else{if(state.credits<120)return status('Crediti insufficienti.');state.credits-=120;occupied.add(id);status('Ormeggio '+id+' prenotato: 120 crediti.')}save();refresh()});
function resize(){camera.aspect=stage.clientWidth/stage.clientHeight;camera.updateProjectionMatrix();renderer.setSize(stage.clientWidth,stage.clientHeight)}new ResizeObserver(resize).observe(stage);resize();renderer.setAnimationLoop(()=>{animate(performance.now()/1000);controls.update();renderer.render(scene,camera)});
</script></body></html>
