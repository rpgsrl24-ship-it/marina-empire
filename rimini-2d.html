<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marina Empire | Rimini 2D</title><style>*{box-sizing:border-box}body{margin:0;background:#061c2e;color:white;font:14px system-ui}header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:#082a42;border-bottom:1px solid #3b6d85}header strong{font:24px Georgia;color:#e9d4a5}a{color:#d7e9f3}main{display:grid;grid-template-columns:280px minmax(0,1fr);height:calc(100dvh - 57px)}aside{background:#092f49;padding:18px;overflow:auto}h2{margin:0 0 15px}button{cursor:pointer;background:#14516c;border:1px solid #5a93a8;color:white;border-radius:7px;padding:10px;width:100%;text-align:left;margin:5px 0}button:hover{background:#26718d}button:disabled{opacity:.4}.stat{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #ffffff28}.stat b{color:#f0ce8a}p{line-height:1.5;color:#c3dce8}#map{width:100%;height:100%;background:#086a88;touch-action:pan-x pan-y}svg .click{cursor:pointer}svg .click:hover{filter:brightness(1.3)}.legend{font-size:12px}.legend i{display:inline-block;width:12px;height:12px;margin-right:5px;border-radius:3px}@media(max-width:760px){main{display:flex;flex-direction:column}aside{max-height:230px;order:2}#map{flex:1;min-height:340px}header strong{font-size:18px}}</style></head><body><header><strong>MARINA EMPIRE</strong><span>Rimini · Planimetria 2D</span><a href="./">Mappa</a></header><main><aside><h2>Marina di Rimini</h2><div class="stat">Crediti <b id="coins">25.000</b></div><div class="stat">Pontili attivi <b id="active">1 / 7</b></div><div class="stat">Ormeggi disponibili <b id="slots">8</b></div><button id="unlock">Costruisci prossimo pontile · 4.000 crediti</button><button id="shops">Gestisci attività commerciali</button><div id="info"><p>Seleziona un pontile o un ormeggio direttamente sulla mappa.</p></div><p class="legend"><i style="background:#ed5d54"></i>Rosso: perimetro darsena</p><p class="legend"><i style="background:#f4bb37"></i>Giallo: primo pontile</p><p class="legend"><i style="background:#35c26d"></i>Verde: ampliamenti a pagamento</p><p class="legend"><i style="background:#7869ff"></i>Blu: zona commerciale</p></aside><svg id="map" viewBox="0 0 1728 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mappa 2D interattiva della Marina di Rimini"><defs><pattern id="waves" width="55" height="55" patternUnits="userSpaceOnUse"><path d="M4 22 Q18 15 32 22" stroke="#75bbcf" stroke-width="1" opacity=".2" fill="none"/></pattern><pattern id="sandDots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="5" cy="7" r="1.3" fill="#bd9a68" opacity=".5"/></pattern></defs><rect width="1728" height="780" fill="#087b9a"/><rect width="1728" height="780" fill="url(#waves)"/><path d="M0 0H1728V405L1440 355L1260 310L1090 250L920 195L730 170L540 150L360 130L160 70L0 45Z" fill="#7b9c72"/><path d="M0 45L160 70L360 130L540 150L730 170L920 195L1090 250L1260 310L1440 355L1728 405L1728 440L1440 390L1260 340L1090 285L920 228L730 205L540 185L360 165L160 105L0 80Z" fill="#e1c797"/><path d="M0 690L280 655L510 630L740 610L930 570L1160 545L1370 510L1728 480V780H0Z" fill="#e1c797"/><path d="M0 690L280 655L510 630L740 610L930 570L1160 545L1370 510L1728 480V780H0Z" fill="url(#sandDots)"/><path d="M205 355L205 420L240 515L290 605L390 666L600 635L790 610L970 550L1160 515L1290 500L1300 410L1350 345L1290 300L1160 255L1080 220" fill="none" stroke="#db5b51" stroke-width="15" stroke-linejoin="round"/><path d="M205 355L340 335L440 310L530 285L630 275L730 280" fill="none" stroke="#db5b51" stroke-width="15" stroke-linejoin="round"/><path d="M1080 220L1000 240L940 270" fill="none" stroke="#db5b51" stroke-width="15"/><path d="M205 355L205 420L240 515L290 605L390 666L600 635L790 610L970 550L1160 515L1290 500L1300 410L1350 345L1290 300L1160 255L1080 220" fill="none" stroke="#c7c7bb" stroke-width="9"/><path d="M205 355L340 335L440 310L530 285L630 275L730 280" fill="none" stroke="#c7c7bb" stroke-width="9"/><path d="M1080 220L1000 240L940 270" fill="none" stroke="#c7c7bb" stroke-width="9"/><path d="M555 675Q800 630 1030 570T1320 510" fill="none" stroke="#7968f5" stroke-width="24" stroke-linecap="round"/><path d="M555 675Q800 630 1030 570T1320 510" fill="none" stroke="#c5c6c0" stroke-width="12"/><circle cx="1420" cy="445" r="80" fill="#bdb3a3" stroke="#858078" stroke-width="12"/><circle cx="1420" cy="445" r="55" fill="#c78b69"/><path d="M1420 396L1432 434L1472 445L1432 456L1420 495L1408 456L1368 445L1408 434Z" fill="#e8c59f"/><g id="city"></g><g id="piers"></g><g id="labels"></g></svg></main><script>
const ns="http://www.w3.org/2000/svg",pierLayer=document.getElementById("piers"),labels=document.getElementById("labels"),city=document.getElementById("city");
function el(tag,attrs,parent){const n=document.createElementNS(ns,tag);for(const[k,v]of Object.entries(attrs))n.setAttribute(k,v);parent.appendChild(n);return n}
for(let i=0;i<12;i++){const x=1080+i%6*95,y=85+Math.floor(i/6)*75;el("rect",{x,y,width:68,height:52,rx:4,fill:i%2?"#e6e3d7":"#f2e9d6",stroke:"#777f80","stroke-width":2},city);el("rect",{x:x+7,y:y+7,width:54,height:18,fill:"#7b9fa7"},city)}
const specs=[{a:[760,320],b:[1020,555],name:"Primo pontile"},{a:[330,360],b:[520,620],name:"Pontile ovest 1"},{a:[430,350],b:[625,605],name:"Pontile ovest 2"},{a:[530,340],b:[735,590],name:"Pontile ovest 3"},{a:[640,325],b:[845,565],name:"Pontile centrale"},{a:[1080,250],b:[965,360],name:"Pontile nord"},{a:[1180,365],b:[1060,490],name:"Pontile est"}];
const key="marina-rimini-2d-plan-v1";let state;try{state=JSON.parse(localStorage.getItem(key))}catch{}state=state||{credits:25000,unlocked:1,booked:{},shops:false};const save=()=>localStorage.setItem(key,JSON.stringify(state)),fmt=n=>n.toLocaleString("it-IT");const info=document.getElementById("info");function message(s){info.innerHTML=s}
function render(){pierLayer.replaceChildren();labels.replaceChildren();document.getElementById("coins").textContent=fmt(state.credits);document.getElementById("active").textContent=state.unlocked+" / 7";document.getElementById("slots").textContent=state.unlocked*8-Object.keys(state.booked).length;document.getElementById("unlock").disabled=state.unlocked===7;
specs.forEach((p,i)=>{const active=i<state.unlocked,color=i===0?"#f4bb37":"#35c26d",dx=p.b[0]-p.a[0],dy=p.b[1]-p.a[1],length=Math.hypot(dx,dy),nx=-dy/length,ny=dx/length;const g=el("g",{"class":"click",opacity:active?1:.38},pierLayer);el("line",{x1:p.a[0],y1:p.a[1],x2:p.b[0],y2:p.b[1],stroke:color,"stroke-width":12,"stroke-linecap":"round"},g);for(let j=0;j<4;j++){const t=.18+j*.19,cx=p.a[0]+dx*t,cy=p.a[1]+dy*t;for(const side of [-1,1]){const x=cx+nx*side*20,y=cy+ny*side*20,id=(i+1)+"-"+(j*2+(side===1?1:2));el("line",{x1:cx,y1:cy,x2:x,y2:y,stroke:color,"stroke-width":5},g);const boat=el("ellipse",{cx:x+nx*side*8,cy:y+ny*side*8,rx:9,ry:17,transform:"rotate("+(Math.atan2(dy,dx)*180/Math.PI-90)+" "+(x+nx*side*8)+" "+(y+ny*side*8)+")",fill:state.booked[id]?"#ffd26e":"#eaf7f9",stroke:"#335c70","stroke-width":2,"class":"click"},g);boat.addEventListener("click",e=>{e.stopPropagation();selectSlot(i,id)})}}g.addEventListener("click",()=>message("<p>"+p.name+(active?" · Attivo":" · Da sbloccare con crediti")+"</p>"));el("text",{x:p.a[0]+dx*.45,y:p.a[1]+dy*.45-15,fill:"#ffffff","font-size":18,"font-weight":"bold","text-anchor":"middle"},labels).textContent=active?"P"+(i+1):"🔒 P"+(i+1)})}
function selectSlot(i,id){if(i>=state.unlocked)return message("<p>Devi prima costruire questo pontile.</p>");message("<h3>Ormeggio "+id+"</h3><p>"+(state.booked[id]?"Prenotato":"Disponibile · 120 crediti")+"</p><button id='book'>"+(state.booked[id]?"Libera ormeggio":"Prenota ormeggio")+"</button>");document.getElementById("book").onclick=()=>{if(state.booked[id])delete state.booked[id];else{if(state.credits<120)return message("<p>Crediti insufficienti.</p>");state.credits-=120;state.booked[id]=true}save();render();selectSlot(i,id)}}
document.getElementById("unlock").onclick=()=>{if(state.unlocked>=7)return;if(state.credits<4000)return message("<p>Crediti insufficienti.</p>");state.credits-=4000;state.unlocked++;save();render();message("<p>Pontile "+state.unlocked+" costruito!</p>")};
document.getElementById("shops").onclick=()=>{message("<h3>Attività commerciali</h3><p>Area blu sul lungomare. Prezzo: 3.000 crediti.</p><button id='buy'>"+(state.shops?"Attività già acquistata":"Acquista attività")+"</button>");document.getElementById("buy").onclick=()=>{if(state.shops||state.credits<3000)return;state.credits-=3000;state.shops=true;save();render();message("<p>Attività commerciale acquistata.</p>")}};render();
</script></body></html>
