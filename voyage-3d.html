<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marina Empire · Simulatore navigazione 3D</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0c4159;color:#fff;font:14px system-ui}#view{position:absolute;inset:0}#hud{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;justify-content:space-between;pointer-events:none}#hud span{background:#062737c9;padding:9px 12px;border:1px solid #d6b77d66;border-radius:8px;font-weight:700}#controls{position:absolute;bottom:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:end;gap:8px}button{border:1px solid #d8b777;border-radius:8px;background:#092d40d9;color:#fff;padding:9px 12px;cursor:pointer}button.active{background:#c7a56c;color:#102b39}#speed{background:#062737c9;padding:9px;border-radius:8px}#fallback{display:none;position:absolute;inset:0;place-items:center;background:#083c50;text-align:center;padding:20px}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js"}}</script></head><body><div id="view"></div><div id="hud"><span id="stage">⚓ Partenza dalla darsena</span><span id="distance">0% · 0 kn</span></div><div id="controls"><div><button id="follow" class="active">Camera inseguimento</button><button id="aerial">Vista dall'alto</button></div><span id="speed">RPG Voyager 10</span></div><div id="fallback">Impossibile caricare la scena 3D. La missione continua normalmente nella mappa.</div><script type="module">
import * as THREE from 'three';
const view=document.getElementById('view'),scene=new THREE.Scene();scene.background=new THREE.Color(0x91c7d5);scene.fog=new THREE.Fog(0x91c7d5,650,2500);
const camera=new THREE.PerspectiveCamera(54,1,.1,3500),renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;view.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe6f5ff,0x365f70,2.1));const sun=new THREE.DirectionalLight(0xffefd2,2.7);sun.position.set(-150,300,-200);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-240;sun.shadow.camera.right=240;sun.shadow.camera.top=240;sun.shadow.camera.bottom=-240;scene.add(sun);
const waterGeo=new THREE.PlaneGeometry(4500,4500,90,90);waterGeo.rotateX(-Math.PI/2);const base=waterGeo.attributes.position;const water=new THREE.Mesh(waterGeo,new THREE.MeshStandardMaterial({color:0x16708a,metalness:.23,roughness:.32,transparent:true,opacity:.97}));scene.add(water);
function box(parent,w,h,d,color,x,y,z){const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,roughness:.65,metalness:.1}));mesh.position.set(x,y,z);mesh.castShadow=true;mesh.receiveShadow=true;parent.add(mesh);return mesh}
const departure=new THREE.Group(),arrival=new THREE.Group();scene.add(departure,arrival);
function buildMarina(group,offset){const pierMat=0xa9a294;box(group,200,3,26,0xb0a493,-65,2,offset-145);for(let i=0;i<4;i++){const x=-135+i*45;box(group,9,3,115,pierMat,x,2,offset-78);for(let j=0;j<4;j++){const z=offset-125+j*28;box(group,1.2,5,1.2,0x3c5156,x-4,4,z);box(group,1.2,5,1.2,0x3c5156,x+4,4,z)}}box(group,230,6,38,0xd9cdb5,-68,4,offset-175);for(let i=0;i<8;i++){const x=-160+i*26;box(group,17,18+(i%3)*7,16,i%2?0xe2dfd5:0xc3d4d7,x,14,offset-204);box(group,18,1,17,0x7e9ba3,x,25+(i%3)*7,offset-204)}for(let i=0;i<8;i++){const x=-130+i*32;const mast=new THREE.Mesh(new THREE.CylinderGeometry(.35,.55,19,8),new THREE.MeshStandardMaterial({color:0xd6e3e4}));mast.position.set(x,11,offset-80);group.add(mast);const sail=new THREE.Mesh(new THREE.BufferGeometry(),new THREE.MeshBasicMaterial({color:0xf0eee7,side:THREE.DoubleSide}));const vertices=new Float32Array([x,19,offset-80,x-9,1,offset-80,x,1,offset-80]);sail.geometry.setAttribute('position',new THREE.BufferAttribute(vertices,3));group.add(sail)}}
buildMarina(departure,0);buildMarina(arrival,0);arrival.position.set(0,0,-1600);arrival.rotation.y=Math.PI;
const boat=new THREE.Group();scene.add(boat);
const hull=new THREE.Mesh(new THREE.CylinderGeometry(7.5,5.4,28,12,1,false,0,Math.PI*2),new THREE.MeshStandardMaterial({color:0xf5f7f4,roughness:.3,metalness:.15}));hull.rotation.x=Math.PI/2;hull.scale.set(1,1,.42);hull.position.y=4;boat.add(hull);
box(boat,12,3,20,0xf2f5f1,0,7,-1);box(boat,10,4,12,0x1b4355,0,10,-3);box(boat,9,1,13,0xf9faf4,0,12.5,-3);box(boat,6,2,7,0xf4f5f0,0,14,-2);box(boat,1,3,1,0x9aa8ac,0,17,-2);box(boat,11,1.2,5,0xc9ad85,0,8,10);box(boat,1,2,14,0xc4d1d1,-6,9,-1);box(boat,1,2,14,0xc4d1d1,6,9,-1);
const wake=new THREE.Group();scene.add(wake);const wakeMat=new THREE.MeshBasicMaterial({color:0xe3faff,transparent:true,opacity:.48,depthWrite:false});for(let i=0;i<14;i++){const ring=new THREE.Mesh(new THREE.RingGeometry(3+i*2,4+i*2,24,1,0,Math.PI),wakeMat.clone());ring.rotation.x=-Math.PI/2;ring.position.set(0,.4,13+i*5);ring.material.opacity=.46*(1-i/16);wake.add(ring)}
let progress=0,mode='follow',last=performance.now();function setMode(next){mode=next;document.getElementById('follow').classList.toggle('active',next==='follow');document.getElementById('aerial').classList.toggle('active',next==='aerial')}document.getElementById('follow').onclick=()=>setMode('follow');document.getElementById('aerial').onclick=()=>setMode('aerial');
window.addEventListener('message',e=>{if(e.origin!==location.origin)return;if(e.data&&e.data.type==='marina-voyage-progress')progress=Math.max(0,Math.min(1,Number(e.data.progress)||0))});
const params=new URLSearchParams(location.search);let origin=params.get('origin')||'rose',destination=params.get('dest')||'rimini';document.getElementById('speed').textContent='RPG Voyager 10 · '+destination.toUpperCase();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.06,(now-last)/1000);last=now;const p=progress;let z,heading=0,speed=0,stage;if(p<.2){const u=p/.2;z=-20-u*210;heading=-.09*Math.sin(u*Math.PI);speed=4+u*9;stage='⚓ Uscita dalla darsena di partenza'}else if(p<.78){const u=(p-.2)/.58;z=-230-u*1120;heading=.03*Math.sin(u*9);speed=18+Math.sin(u*Math.PI)*5;stage='🌊 Navigazione in mare aperto'}else{const u=(p-.78)/.22;z=-1350-u*205;heading=.06*Math.sin(u*Math.PI);speed=18*(1-u)+2;stage='⚓ Ingresso nella darsena di arrivo'}
boat.position.set(5*Math.sin(p*12),Math.sin(now*.0018)*.5,z);boat.rotation.set(.012*Math.sin(now*.0015),heading,.022*Math.sin(now*.001));wake.position.set(boat.position.x,.1,boat.position.z);wake.rotation.y=heading;wake.visible=p>.035&&p<.97;
const desired=mode==='aerial'?new THREE.Vector3(boat.position.x+110,boat.position.y+150,boat.position.z+120):new THREE.Vector3(boat.position.x+34,boat.position.y+34,boat.position.z+77);camera.position.lerp(desired,Math.min(1,dt*2.6));camera.lookAt(boat.position.x,7,boat.position.z-32);const pos=base;for(let i=0;i<pos.count;i++){const x=pos.getX(i),z=pos.getZ(i);pos.setY(i,Math.sin(x*.035+now*.0011)*.48+Math.cos(z*.028+now*.0014)*.37)}pos.needsUpdate=true;waterGeo.computeVertexNormals();document.getElementById('stage').textContent=stage;document.getElementById('distance').textContent=Math.round(p*100)+'% · '+Math.round(speed)+' kn';renderer.render(scene,camera)}
function resize(){renderer.setSize(view.clientWidth,view.clientHeight);camera.aspect=view.clientWidth/view.clientHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();requestAnimationFrame(frame);
</script></body></html>
