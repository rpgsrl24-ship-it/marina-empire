<script>
(()=>{try{
 const q=new URLSearchParams(location.search);
 const view=(q.get("view")||"").toLowerCase();
 const routes={
  home:"./mobile-home.html?v=20261111-home6",
  missions:"./missions-mobile.html?v=20261111-missions9",
  mission:"./missions-mobile.html?v=20261111-missions9",
  map:"./map-mobile.html?v=20261119-map18",
  cabin:"./cabina-mobile.html?v=20261120-cabin18",
  cabina:"./cabina-mobile.html?v=20261120-cabin18",
  marinas:"./marina-mobile.html?v=20261111-marina4",
  marina:"./marina-mobile.html?v=20261111-marina4",
  fleet:"./fleet-mobile.html?v=20261109-fleet1",
  flotta:"./fleet-mobile.html?v=20261109-fleet1",
  marketplace:"./marketplace-mobile.html?v=20261110-market13",
  market:"./marketplace-mobile.html?v=20261110-market13",
  community:"./community-mobile.html?v=20261110-community3",
  profile:"./profile-mobile.html?v=20261110-profile1",
  office:"./direction-mobile.html?v=20261110-direction1",
  direction:"./direction-mobile.html?v=20261110-direction1",
  activities:"./activities-mobile.html?v=20261110-activities1",
  research:"./research-mobile.html?v=20261109-research1",
  alliance:"./alliance-mobile.html?v=20261110-alliance1",
  ranking:"./ranking-mobile.html?v=20261110-ranking1"
 };
 const creditReturn=q.get("credit_purchase")==="success";
 const target=creditReturn?"./marketplace-mobile.html?v=20261110-market13&credit_purchase=success":(routes[view]||"./mobile-home.html?v=20261111-home6");
 const next=new URL(target,location.href);
 for(const key of ["utm_source","utm_medium","utm_campaign"]){const value=q.get(key);if(value&&/^[a-zA-Z0-9_. -]{1,80}$/.test(value))next.searchParams.set(key,value);}
 if(!next.searchParams.has("utm_source")&&document.referrer){try{const u=new URL(document.referrer);if(u.origin!==location.origin)next.searchParams.set("utm_source",u.hostname.slice(0,80));}catch(_){}}
 next.hash=location.hash;location.replace(next.href);
}catch(_){location.replace("./mobile-home.html?v=20261111-home6")}})();
</script>
